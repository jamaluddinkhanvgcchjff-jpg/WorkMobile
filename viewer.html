<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkMobile Viewer</title><style>
body{margin:0;background:#101512;color:#fff;font-family:Arial;text-align:center}header{padding:18px;background:#08723e;font-size:22px;font-weight:bold}
main{padding:20px}video{width:100%;max-width:900px;background:#000;border-radius:14px;margin-top:20px}.status{padding:12px}
</style></head><body><header>💰 WorkMobile — Live Viewer</header><main>
<div class="status" id="status">সংযোগের অপেক্ষায়…</div><video id="remote" autoplay playsinline controls></video>
<p>লাইভ স্ক্রিনটি শুধুমাত্র তখনই দেখা যাবে যখন অন্য ডিভাইসের ব্যবহারকারী নিজে Screen Share অনুমতি দিয়েছেন।</p>
</main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), remote=document.getElementById('remote'), status=document.getElementById('status');
const room=new URLSearchParams(location.search).get('room'); let pc;
const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function make(){pc=new RTCPeerConnection(cfg);
pc.ontrack=e=>{remote.srcObject=e.streams[0];status.textContent='লাইভ স্ক্রিন সংযুক্ত হয়েছে।'};
pc.onicecandidate=e=>{if(e.candidate)socket.emit('signal',{room,data:{type:'ice',candidate:e.candidate}})};
}
socket.on('connect',()=>{if(!room){status.textContent='Room ID প্রয়োজন। URL-এ ?room=... দিন।';return} make(); socket.emit('join-room',room);});
socket.on('signal',async d=>{
 if(d.type==='offer'){
  if(!pc)make(); await pc.setRemoteDescription(d.sdp);
  const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
  socket.emit('signal',{room,data:{type:'answer',sdp:pc.localDescription}});
 } else if(d.type==='ice'&&pc){try{await pc.addIceCandidate(d.candidate)}catch(e){}}
});
</script></body></html>
