<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkMobile Viewer</title><style>body{margin:0;background:#101512;color:white;font-family:Arial;text-align:center}header{padding:18px;background:#08723e;font-size:22px;font-weight:bold}main{padding:20px}video{width:100%;max-width:900px;background:#000;border-radius:14px;margin-top:20px}.status{padding:12px}</style></head><body><header>💰 WorkMobile — Live Viewer</header><main><div id="s" class="status">সংযোগের অপেক্ষায়…</div><video id="v" autoplay playsinline controls></video><p>অন্য ডিভাইসের ব্যবহারকারী নিজে Screen Share অনুমতি দিলে তবেই লাইভ দেখা যাবে।</p></main>
<script src="/socket.io/socket.io.js"></script><script>const socket=io(),room=new URLSearchParams(location.search).get("room"),v=document.getElementById("v"),s=document.getElementById("s");let pc;const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};function make(){pc=new RTCPeerConnection(cfg);pc.ontrack=e=>{v.srcObject=e.streams[0];s.textContent="লাইভ স্ক্রিন সংযুক্ত হয়েছে।"};pc.onicecandidate=e=>e.candidate&&socket.emit("signal",{room,data:{type:"ice",candidate:e.candidate}})}socket.on("connect",()=>{if(!room){s.textContent="URL-এ ?room=ROOM_ID দিন।";return}make();socket.emit("join-room",room)});socket.on("signal",async d=>{if(d.type==="offer"){await pc.setRemoteDescription(d.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);socket.emit("signal",{room,data:{type:"answer",sdp:pc.localDescription}})}else if(d.type==="ice")try{await pc.addIceCandidate(d.candidate)}catch(e){}});</script></body></html>
